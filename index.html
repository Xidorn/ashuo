<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <title>阿朔</title>

  <meta name="image" content="https://www.ashuo.com/images/1.webp">
  <meta property="og:title" content="阿朔">
  <meta property="og:description" content="阿朔，是我收养的四只猫：大阿朔、小阿朔、小小阿朔、旺仔。">
  <meta name="author" content="阿朔">
  <meta name="copyright" content="阿朔">
  <meta property="og:url" content="https://www.ashuo.com">
  <meta property="og:image" content="https://www.ashuo.com/images/1.webp">
  <meta property="og:site_name" content="阿朔">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fdf9f5;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ffeede;
      border-bottom: 2px solid #f4d4bd;
      border-radius: 0 0 20px 20px;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      flex: 1;
      padding: 40px 20px;
    }
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      justify-items: center;
    }
    .pet-card {
      width: 100%;
      max-width: 220px;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: transform .25s;
    }
    .pet-card:hover {
      transform: translateY(-6px);
    }
    .pet-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      border-radius: 18px;
      transition: transform .3s;
    }
    .pet-card img:hover {
      transform: scale(1.06);
    }
    footer {
      background: #fff;
      border-top: 2px solid #f5e1d3;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="fw-bold display-5">阿朔的萌宠小世界</h1>
    <p class="mt-3 mb-0">阿朔，是我收养的四只猫：大阿朔、小阿朔、小小阿朔、旺仔。</p>
  </header>

  <main class="container">
    <div class="pet-grid">
      <div class="pet-card"><img src="/images/1.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/2.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/3.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/5.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/6.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/7.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/4.webp" alt="阿朔"></div>
      <div class="pet-card"><img src="/images/wangzai.jpg" alt="旺仔"></div>
    </div>
  </main>

  <footer>
    <div>&copy;2025 <a href="https://www.ashuo.com" class="fw-bold text-decoration-none text-dark">阿朔</a> 版权所有</div>
    <div class="small mt-1">由 <a href="http://www.wangxiansheng.com/" target="_blank" rel="nofollow" class="text-reset text-decoration-none">王先生</a> 技术支持</div>
  </footer>

</body>
</html>
