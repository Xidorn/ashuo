<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <title>阿朔</title>

  <meta name="image" content="https://www.ashuo.com/images/1.webp">
  <meta property="og:title" content="阿朔">
  <meta property="og:description" content="阿朔，是我收养的两只猫（不算小小阿朔），一只大阿朔，一只小阿朔，还有一只小小阿朔。">
  <meta name="author" content="王先生">
  <meta name="copyright" content="王先生">
  <meta property="og:url" content="https://www.ashuo.com">
  <meta property="og:image" content="https://www.ashuo.com/images/1.webp">
  <meta property="og:site_name" content="阿朔">

  <style>
  *{box-sizing:border-box;}
  
  body{
    margin:0;
    font-family:"PingFang SC","Noto Serif SC","Microsoft YaHei",serif;
    background:#f5f3ee;
    color:#2b2b2b;
    line-height:1.9;
  }
  
  /* ===== 头部 ===== */
  header{
    text-align:center;
    padding:120px 20px 80px;
    max-width:900px;
    margin:auto;
  }
  
  header h1{
    font-size:3rem;
    font-weight:600;
    letter-spacing:8px;
    margin-bottom:50px;
    color:#1f1f1f;
  }
  
  header p{
    margin:12px 0;
    font-size:1.05rem;
    color:#444;
  }
  
  /* 墨线分割 */
  .divider{
    width:60px;
    height:1px;
    background:#999;
    margin:60px auto;
    opacity:0.6;
  }
  
  /* ===== 图片区域 ===== */
  .gallery{
    max-width:1200px;
    margin:auto;
    padding:0 20px 120px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:200px;
    gap:20px;
  }
  
  .gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:all .6s ease;
    filter:contrast(0.95) brightness(0.98);
  }
  
  .gallery img:hover{
    transform:scale(1.03);
    filter:contrast(1.05);
  }
  
  /* ===== 排版结构 ===== */
  
  /* 第一张：主视觉 */
  .item1{grid-column:1/7; grid-row:1/3;}
  
  /* 第二行 */
  .item2{grid-column:1/4; grid-row:3/5;}
  .item3{grid-column:4/7; grid-row:3/5;}
  
  /* 第三行错落 */
  .item4{grid-column:1/3; grid-row:5/7;}
  .item5{grid-column:3/5; grid-row:5/7;}
  .item6{grid-column:5/7; grid-row:5/7;}
  
  /* 收尾 */
  .item7{grid-column:1/4; grid-row:7/9;}
  .item8{grid-column:4/7; grid-row:7/9;}
  
  /* ===== 页脚 ===== */
  footer{
    text-align:center;
    padding:60px 20px;
    font-size:0.9rem;
    color:#666;
    border-top:1px solid #ddd;
  }
  
  /* ===== 响应式 ===== */
  @media(max-width:900px){
    .gallery{
      grid-template-columns:repeat(2,1fr);
      grid-auto-rows:220px;
    }
    .item1,.item2,.item3,.item4,.item5,.item6,.item7,.item8{
      grid-column:auto;
      grid-row:auto;
    }
  }
  
  @media(max-width:500px){
    header{
      padding:80px 20px 50px;
    }
    header h1{
      font-size:2rem;
      letter-spacing:4px;
    }
  }
  </style>
  </head>
  
  <body>
  
  <header>
    <h1>阿朔</h1>
  
    <p>阿朔，是我收养的两只猫，一只大阿朔，一只小阿朔（2022年1月30日）。</p>
    <p>它俩都是2020年7月份来的，只是大阿朔比小阿朔略早了一两个礼拜吧。</p>
    <p>2022年7月8日，再次收养一只小小阿朔（2024年9月7日）。</p>
    <p>2023年10月2日，旺仔加入我们的大家庭。（2024年1月28日）</p>
  
    <div class="divider"></div>
  </header>
  
  <section class="gallery">
    <img src="https://www.ashuo.com/images/1.webp" class="item1">
    <img src="https://www.ashuo.com/images/2.webp" class="item2">
    <img src="https://www.ashuo.com/images/3.webp" class="item3">
    <img src="https://www.ashuo.com/images/5.webp" class="item4">
    <img src="https://www.ashuo.com/images/6.webp" class="item5">
    <img src="https://www.ashuo.com/images/7.webp" class="item6">
    <img src="https://www.ashuo.com/images/4.webp" class="item7">
    <img src="https://www.ashuo.com/images/wangzai.jpg" class="item8">
  </section>
  
  <footer>
    ©2025 阿朔 版权所有<br>
    由 王先生 技术支持
  </footer>
  
  </body>
</html>
